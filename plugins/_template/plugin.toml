# Plugin manifest — see PLUGIN_GUIDE.md section 3.
# Copy the whole _template folder to plugins/<id>/ and edit the lines below.

id = "rename_to_folder_name"     # same as the folder name: lowercase ASCII, digits, _ (e.g. "update_tracker")
name = "Package notes"           # name shown in the menu
description = "Sample plugin: notes per top-up package, showing how to save / read data through sdk."
version = "0.1.0"                # bump on every update, note it in the README Changes section
owners = ["your_account"]        # website accounts of the people in charge (one or more)
icon = ":material/sticky_note_2:"  # :material/<name>: (fonts.google.com/icons) or one emoji
section = "Plugin"               # menu group in the left sidebar
access = "all"                   # all = everyone signed in; admin = admins only
games = []                       # [] = every game; ["l2m"] = only when Lineage2M SEA is selected

[[pages]]                        # one [[pages]] block per page
file = "page.py"
title = "Package notes"
icon = ":material/sticky_note_2:"
